<section class="client-feedback-container">
    <div class="sub-title flex">
        <div class="green-bullet"></div>Recommendations
    </div>
    <div class="title">
        Clients & Colleague Feedback
    </div>
    <div class="skill-info">
        <div class="client-container">
            <div class="scrollable">
                <div *ngFor="let item of recommendations, let i = index" class="item-container">
                    <div class="bg-client">

                        <app-icon-svg [iconName]="'client_comment'"></app-icon-svg>
                    </div>
                    <div class="flex">
                        <div class="feedback desc" [innerHTML]="item.content"></div>
                        <div class="details name">
                            {{item.name}} &nbsp;<span>| &nbsp;{{item.role}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="flower-icon">
        <app-icon-svg class="flower-icon" [iconName]="'about_flower'"></app-icon-svg>
    </div>
</section>
